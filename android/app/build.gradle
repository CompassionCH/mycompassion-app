apply plugin: 'com.android.application'

android {
    namespace = "ch.mycompassion.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.mycompassion.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.4"
        // Overridden by the stage flavour so both apps can be installed at once.
        manifestPlaceholders = [appUrlScheme: "mycompassion", appLinkHost: "mycompassion.ch"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "env"
    productFlavors {
        prod {
            dimension "env"
            // applicationId ch.mycompassion.app (production)
        }
        stage {
            dimension "env"
            // Points at stage.compassion.ch. Installs side-by-side with prod.
            // app_name is overridden in src/stage/res/values/strings.xml.
            // Reuses the existing ch.mycompassion.app.dev Firebase client.
            applicationIdSuffix ".dev"
            // Own scheme and App Link host: a build that claims a domain
            // vouching for the other package fails verification.
            manifestPlaceholders = [appUrlScheme: "mycompassion-stage", appLinkHost: "stage18.compassion.ch"]
        }
    }
}

// Mirrors the iOS "Verify server config" phase: release builds fail when the
// synced Capacitor config points at the other environment.
def expectedServerHosts = [prod: "mycompassion.ch", stage: "stage18.compassion.ch"]
expectedServerHosts.each { flavor, host ->
    def verify = tasks.register("verify${flavor.capitalize()}ServerConfig") {
        doLast {
            def config = file("src/main/assets/capacitor.config.json")
            def sync = flavor == "stage" ? "sync:dev-android" : "sync:prod-android"
            if (!config.exists()) {
                throw new GradleException("${config} missing. Run npm run ${sync} and build again.")
            }
            if (!config.text.contains("\"url\": \"https://${host}")) {
                throw new GradleException(
                    "${flavor} build must point at ${host}. Run npm run ${sync} and build again.")
            }
        }
    }
    tasks.matching {it.name == "pre${flavor.capitalize()}ReleaseBuild"}.configureEach {
        dependsOn verify
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation("com.airbnb.android:lottie:6.7.1")
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
}

apply from: 'capacitor.build.gradle'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
